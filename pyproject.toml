[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "chatstyle"
version = "0.1.0"
description = "Верификация авторства русскоязычной переписки"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = ["typer>=0.12", "rich>=13", "telethon>=1.36", "pywebview>=5", "cryptography>=42"]

[project.scripts]
chatstyle = "chatstyle.__main__:main"

[project.gui-scripts]
chatstyle-gui = "chatstyle.gui:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
experiments = ["matplotlib"]
morph = ["pymorphy3>=2", "pymorphy3-dicts-ru"]  # части речи: необязательное дополнение

[tool.scikit-build]
wheel.packages = ["python/chatstyle"]
cmake.version = ">=3.20"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
