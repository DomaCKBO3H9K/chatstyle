name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3-dev

      - name: Install the project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,experiments,morph]"

      - name: Lint with ruff
        run: ruff check python tests experiments docs packaging

      - name: Check formatting with ruff
        run: ruff format --check python tests experiments docs packaging

      - name: Run Python tests
        run: pytest -ra

      - name: Configure the core tests
        run: cmake -S . -B build -DCHATSTYLE_BUILD_TESTS=ON -DCHATSTYLE_BUILD_PYTHON=OFF

      - name: Build the core tests
        run: cmake --build build --config Release

      - name: Run the core tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build a wheel
        run: python -m pip wheel . --no-deps -w wheelhouse

      - name: Install the wheel and run it
        shell: bash
        run: |
          python -m pip install --no-deps --force-reinstall wheelhouse/chatstyle-*.whl
          cd "$RUNNER_TEMP"
          chatstyle --version
          python -m chatstyle --version

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
